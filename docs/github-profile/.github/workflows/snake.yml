# Genera la serpiente que recorre el gráfico de contribuciones (colores del portafolio)
# y la publica en la rama "output". Corre cada 12 h y a mano desde la pestaña Actions.
name: snake
on:
  schedule: [{ cron: '0 */12 * * *' }]
  workflow_dispatch:
  push: { branches: [main] }
permissions: { contents: write }
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#afff00&color_dots=#161b22,#294000,#4b7101,#8bcb01,#afff00
            dist/snake-light.svg?color_snake=#8002fe&color_dots=#ebedf0,#d3c8ff,#a685fe,#935dfe,#8002fe
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
